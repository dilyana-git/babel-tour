    <path d="M13 39V21L32 10 51 21M23 46V27L32 22 41 27" stroke="#fff3ce" stroke-opacity=".55" stroke-width="1"/>
  </g>
  <path d="M29.5 36V31.5a2.5 2.5 0 0 1 5 0V36Z" fill="#fff1c1"/>
