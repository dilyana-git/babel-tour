<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Babel Tour — the illuminated labyrinth</title>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#2d2920"/>
      <stop offset="1" stop-color="#100e0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="12" y1="14" x2="49" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0bb"/>
      <stop offset=".45" stop-color="#dfb965"/>
      <stop offset="1" stop-color="#a96c2e"/>
    </linearGradient>
    <radialGradient id="light">
